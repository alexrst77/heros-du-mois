<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/static/marque/favicon-64.png">
<link rel="apple-touch-icon" href="/static/marque/apple-touch-icon.png">
<title>Atelier – Mon Héros du Mois</title>
<style>
  :root {
    --bg:#FBF5EA; --card:#FFFFFF; --ink:#1F2557; --soft:#6B6F8E; --line:#EADFCB; --gold:#E8B54A; --gold-soft:#FCEFD2;
    --blue:#3D6BD8; --blue-soft:#E3EBFC; --green:#2E9E68; --green-soft:#DDF3E7; --red:#D9534F; --red-soft:#FBE3E1;
    --grey-soft:#EFEBE3; --violet:#7A5AD8; --violet-soft:#ECE6FB; --shadow:0 2px 10px rgba(31,37,87,.07);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, sans-serif; }
  a { color:var(--blue); }
  .wrap { max-width:1100px; margin:0 auto; padding:18px 16px 80px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  header img { width:44px; height:44px; }
  header h1 { font:700 24px Georgia, serif; margin:0; }
  header .hi { color:var(--soft); font-size:14px; }
  nav { display:flex; gap:6px; overflow-x:auto; padding:4px 0 10px; margin-bottom:8px; position:sticky; top:0; background:var(--bg); z-index:5; }
  nav button { flex:none; border:0; background:transparent; color:var(--soft); font:600 15px system-ui; padding:9px 14px; border-radius:999px; cursor:pointer; }
  nav button.on { background:var(--ink); color:#fff; }
  nav .badge { display:inline-block; min-width:20px; padding:0 6px; margin-left:4px; border-radius:999px; background:var(--gold); color:var(--ink); font-size:12px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-bottom:18px; }
  .tile { background:var(--card); border-radius:16px; padding:14px; box-shadow:var(--shadow); cursor:pointer; border:2px solid transparent; }
  .tile:hover { border-color:var(--line); }
  .tile .n { font:700 30px Georgia, serif; } .tile .l { color:var(--soft); font-size:13px; } .tile .e { font-size:22px; float:right; }
  h2 { font:700 19px Georgia, serif; margin:22px 0 10px; }
  .empty { text-align:center; padding:40px 10px; color:var(--soft); background:var(--card); border-radius:16px; box-shadow:var(--shadow); }
  .empty .big { font-size:44px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .chips button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:6px 12px; font:600 13px system-ui; cursor:pointer; }
  .chips button.on { background:var(--gold-soft); border-color:var(--gold); }
  .book { display:grid; grid-template-columns:96px 1fr; gap:14px; background:var(--card); border-radius:18px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow); }
  .cover { width:96px; height:96px; border-radius:10px; object-fit:cover; background:linear-gradient(135deg, #F7D99A, #9DB7F0); display:flex; align-items:center; justify-content:center; font-size:38px; overflow:hidden; box-shadow:2px 3px 0 rgba(31,37,87,.15); }
  .cover img { width:100%; height:100%; object-fit:cover; }
  .title { font:700 17px Georgia, serif; margin:0 0 2px; }
  .meta { color:var(--soft); font-size:13px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; font-weight:700; font-size:13px; margin:6px 6px 0 0; }
  .p-gold { background:var(--gold-soft); color:#8A5A00; } .p-blue { background:var(--blue-soft); color:var(--blue); } .p-green { background:var(--green-soft); color:var(--green); }
  .p-red { background:var(--red-soft); color:var(--red); } .p-grey { background:var(--grey-soft); color:var(--soft); } .p-violet { background:var(--violet-soft); color:var(--violet); }
  .say { margin:8px 0 0; }
  .bar { height:8px; background:var(--grey-soft); border-radius:99px; overflow:hidden; margin-top:8px; max-width:420px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg, var(--blue), var(--violet)); border-radius:99px; transition:width .6s; }
  .money { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--soft); margin-top:8px; }
  .prog { display:flex; align-items:center; gap:10px; max-width:460px; margin-top:8px; } .prog .bar { flex:1; margin:0; }
  .bar.big { height:12px; } .prog b { font:800 15px system-ui; min-width:46px; text-align:right; }
  .money .bar { width:120px; height:6px; margin:0; } .money .bar i { background:var(--green); }
  .money .bar i.warn { background:var(--gold); }
  .acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .btn { border:0; border-radius:12px; padding:10px 16px; font:700 14px system-ui; cursor:pointer; background:var(--grey-soft); color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .btn.main { background:var(--ink); color:#fff; } .btn.ok { background:var(--green); color:#fff; } .btn.gold { background:var(--gold); color:var(--ink); }
  .btn.danger { background:var(--red-soft); color:var(--red); } .btn:disabled { opacity:.5; cursor:wait; }
  details { margin-top:10px; } summary { cursor:pointer; color:var(--soft); font-size:13px; font-weight:600; }
  .more { margin-top:8px; font-size:13px; color:var(--soft); } .more .acts { margin-top:8px; } .more .btn { padding:7px 12px; font-size:13px; }
  .files a { display:inline-block; margin:4px 10px 0 0; }
  .issues { margin:8px 0 0; padding:10px 12px; background:var(--gold-soft); border-radius:12px; font-size:13px; }
  .issues.red { background:var(--red-soft); }
  .result { position:relative; margin-top:10px; padding:12px 40px 12px 14px; border-radius:12px; background:var(--blue-soft); font-size:14px; }
  .result.ok { background:var(--green-soft); } .result.err { background:var(--red-soft); color:#8B2420; }
  .result .x { position:absolute; top:6px; right:8px; border:0; background:transparent; font-size:18px; cursor:pointer; color:var(--soft); }
  .result table { margin-top:6px; } .result .big { font:700 20px Georgia, serif; }
  .issues ul { margin:4px 0 0 18px; padding:0; }
  .card { background:var(--card); border-radius:18px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14px; } .kv span:nth-child(odd) { color:var(--soft); }
  dialog { border:0; border-radius:18px; padding:0; max-width:640px; width:calc(100% - 32px); box-shadow:0 20px 60px rgba(0,0,0,.25); color:var(--ink); }
  dialog .in { padding:18px; max-height:80vh; overflow:auto; }
  dialog h3 { font:700 18px Georgia, serif; margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; } td, th { padding:6px 4px; border-bottom:1px solid var(--line); text-align:left; } td.r, th.r { text-align:right; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(120px); background:var(--ink); color:#fff; padding:12px 18px; border-radius:14px; font-weight:600; max-width:calc(100% - 32px); transition:transform .3s, opacity .3s; z-index:20; opacity:0; pointer-events:none; }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  @media (max-width:560px) { .book { grid-template-columns:64px 1fr; } .cover { width:64px; height:64px; font-size:28px; } .tile .n { font-size:24px; } }
</style>
</head>
<body>
<div class="wrap">
  <header><img src="/static/marque/etoile-128.png" alt=""><div><h1>L'atelier</h1><div class="hi" id="hi">Chargement…</div></div></header>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>
<div id="toast"></div>
<script>
const code = new URLSearchParams(location.search).get('code') || '';
const H = { 'X-Admin': code }, Q = '?code=' + encodeURIComponent(code);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = c => (c / 100).toFixed(2).replace('.', ',') + ' €';
const usd = v => (v || 0).toFixed(2).replace('.', ',') + ' $';
const day = t => t ? new Date(t * 1000).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : '';
const FORMULE = { livre: '1 livre', pack3: 'Pack 3 livres', pack6: 'Pack 6 livres', pack12: 'Pack 12 livres', fetes: '6 livres de fête', mensuel: 'Abonnement (ancien)', annuel: 'Abonnement annuel', essai_brouillon: 'Essai brouillon', essai_apercu: 'Essai aperçu', calendrier: '📅 Calendrier', coloriage: '🖍️ Cahier de coloriage' };
// colis = livres + calendrier de la même commande
const NB = o => (o.pack_total || 0) + (o.pack_cal || 0), PRETS = o => (o.pack_prets || 0) + (o.pack_cal_prets || 0);
const colis = o => [(o.pack_total ? `${o.pack_total} livre${o.pack_total > 1 ? 's' : ''}` : '')].concat((o.pack_extras || []).map(x => x === 'calendrier' ? 'le calendrier' : 'le cahier')).filter(Boolean).join(' + ');
let D = null, TAB = 'accueil', FILTRE = 'actifs';
const RES = {}, OPEN = new Set();   // résultats affichés sous un livre (restent jusqu'à ce que tu les fermes) ; menus ouverts

function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 4200); }

// État d'un livre, en clair
function etat(o) {
  const essai = (o.formule || '').startsWith('essai');
  if (o.statut === 'attente_paiement') return { k: 'paiement', pill: ['p-grey', '💳', 'Attend le paiement'], say: "Le client n'a pas encore payé." };
  if (o.statut === 'attente_fete') return { k: 'attente', pill: ['p-violet', '🎉', 'Attend sa fête'], say: 'Il partira tout seul 35 jours avant la fête.' };
  if (o.en_cours || ['payee', 'generation'].includes(o.statut)) return { k: 'fabrication', pill: ['p-blue', '🎨', 'En fabrication'], say: o.etape ? esc(o.etape) + '…' : 'Le livre se fabrique (5 à 10 minutes).' };
  if (o.statut === 'erreur' && !o.pdf) return { k: 'bloque', pill: ['p-red', '⚠️', 'Bloqué'], say: 'La fabrication s\'est arrêtée. Rien n\'est perdu : ce qui est fait est gardé.' };
  if (o.statut === 'a_verifier' || (o.statut === 'erreur' && o.pdf)) {
    if (essai) return { k: 'essai', pill: ['p-violet', '🧪', 'Essai terminé'], say: 'Livre d\'essai : à regarder, jamais imprimé.' };
    if (o.finalise && NB(o) > 1 && (PRETS(o) < NB(o) || (o.origine && o.origine !== o.id)))
      return { k: 'valide', pill: ['p-green', '✅', 'Validé'], say: PRETS(o) < NB(o)
        ? `Figé et sauvegardé. Le colis partira quand tout sera validé : ${colis(o)} (${PRETS(o)}/${NB(o)}).`
        : 'Figé et sauvegardé. Il part avec le livre 1 du pack, dans le même colis.' };
    if (o.finalise) return { k: 'pret', pill: ['p-green', '✅', 'Prêt à imprimer'], say: NB(o) > 1 ? `Tout est validé (${colis(o)}) : ça part ensemble, dans un seul colis.` : 'Figé et sauvegardé. Il ne coûtera plus jamais rien en IA.' };
    return { k: 'relire', pill: ['p-gold', '👀', 'À relire'], say: 'Ouvre le livre, regarde les pages, puis valide-le.' };
  }
  if (o.statut === 'envoyee_impression') return { k: 'imprimeur', pill: ['p-blue', '🖨️', "Chez l'imprimeur"], say: o.lulu_statut ? 'Statut Lulu : ' + esc(o.lulu_statut) : '' };
  if (o.statut === 'expediee') return { k: 'expedie', pill: ['p-green', '📦', 'Expédié'], say: (o.suivi || []).length ? 'Colis en route.' : '' };
  if (o.statut === 'annulee') return { k: 'archive', pill: ['p-grey', '🗂️', 'Archivé'], say: o.erreur === 'données effacées' ? 'Données effacées.' : '' };
  return { k: 'autre', pill: ['p-grey', '•', o.statut], say: '' };
}
const AFAIRE = ['relire', 'bloque', 'pret'];

function boutons(o, e) {
  const pdf = (o.fichiers || []).find(f => f.endsWith('.pdf') && !f.startsWith('impression_'));
  const lire = pdf ? `<a class="btn" target="_blank" href="/admin/fichier/${o.id}/${encodeURIComponent(pdf)}${Q}">${o.calendrier ? '📅 Voir le calendrier' : o.coloriage ? '🖍️ Voir le cahier' : '📖 Lire le livre'}</a>` : '';
  const b = (a, t, cls = '') => `<button class="btn ${cls}" onclick="act('${o.id}','${a}',this)">${t}</button>`;
  let main = '';
  if (e.k === 'paiement' && D.config.stripe === 'simulé') main = b('valider-paiement-test', '💳 Simuler le paiement', 'main');
  if (e.k === 'relire') main = lire + b('finaliser', "✅ C'est bon, je valide", 'ok') + (o.refusees ? b('refaire-refusees', '🔁 Refaire les images refusées') : '');
  if (e.k === 'pret') main = lire + b('imprimer', NB(o) > 1 ? `🖨️ Envoyer le colis (${colis(o)})` : "🖨️ Envoyer à l'impression", 'gold');
  if (e.k === 'valide') main = lire;
  if (e.k === 'essai') main = lire;
  if (e.k === 'bloque' && o.budget && (o.budget.incertain > 0 || o.budget.reserve > 0) && !o.en_cours) main = b('budget', '💰 Régler l\'appel incertain', 'main');
  else if (e.k === 'bloque') main = (o.refusees ? b('refaire-refusees', '🔁 Refaire les images refusées', 'main') : '') + b('relancer', '▶️ Relancer', o.refusees ? '' : 'main');
  if (e.k === 'imprimeur') main = b('suivi', '🔄 Actualiser le suivi', 'main');
  if (e.k === 'expedie') main = (o.suivi || []).map(u => `<a class="btn main" target="_blank" href="${esc(u)}">📍 Suivre le colis</a>`).join('');
  const sec = [];
  if (!['paiement', 'archive'].includes(e.k)) sec.push(b('budget', '💰 Coût IA détaillé'));
  if (e.k === 'pret' || e.k === 'valide') sec.push(b('mail-pret', o.pack_mail ? '📧 Renvoyer le mail « prêt »' : '📧 Envoyer le mail « prêt »'));
  if (['relire', 'pret', 'valide'].includes(e.k)) sec.push(b('couverture', '📐 Préparer la couverture'), b('cout', '🏷️ Prix Lulu'), b('verifier-lulu', '🔎 Vérifier les fichiers chez Lulu'));
  if (o.extra && e.k === 'relire') sec.push(b('recomposer', '🔁 Recomposer les pages (sans IA)'));
  if (o.abonnement_id) sec.push(b('mois-suivant', '➕ Livre suivant'), b('arreter-abonnement', '⏹️ Arrêter l\'abonnement', 'danger'));
  if (!['paiement', 'archive'].includes(e.k) && !(o.formule || '').startsWith('essai') && !o.extra) sec.push(b('essai-apercu', '🧪 Essai aperçu (≈ 1 $)'), b('essai-brouillon', '🧪 Essai brouillon (≈ 0,5 $)'));
  if (!['paiement', 'archive'].includes(e.k) && !(o.formule || '').startsWith('essai') && !o.extra)
    sec.push(b('test-calendrier', '🧪 Calendrier de test (≈ 1,50 $)'), b('test-coloriage', '🧪 Cahier de coloriage de test (≈ 2,50 $)'));
  if (e.k === 'relire') sec.push(b('relancer', '♻️ Refaire tout le livre', 'danger'));
  if (['expedie', 'bloque', 'archive'].includes(e.k) && o.job_id && o.erreur !== 'données effacées') sec.push(b('effacer', '🧹 Effacer les données', 'danger'));
  if (!o.en_cours) sec.push(b('supprimer', '🗑️ Supprimer la commande', 'danger'));
  return { main, sec: sec.join('') };
}

function carte(o) {
  const e = etat(o), bt = boutons(o, e), a = o.adresse || {};
  const titre = o.titre || (o.prenom ? `${o.calendrier ? 'Le calendrier' : o.coloriage ? 'Le cahier de coloriage' : 'Le livre'} de ${esc(o.prenom)}` : 'En préparation');
  const cov = o.vignette ? `<div class="cover"><img loading="lazy" src="/admin/vignette/${o.id}${Q}&v=${o.finalise ? 1 : 0}" alt=""></div>` : `<div class="cover">${e.k === 'fabrication' ? '🎨' : '📖'}</div>`;
  const PL = o.plafond || D.plafond, bud = o.budget ? o.budget.total : null, pct = bud != null ? Math.min(100, bud / PL * 100) : 0;
  const issues = (o.controle || []).length && e.k !== 'pret'
    ? `<div class="issues"><b>Le contrôle a remarqué :</b><ul>${o.controle.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
  const err = o.erreur && o.erreur !== 'données effacées' && e.k !== 'pret' ? `<div class="issues red">${esc(o.erreur.replace(/^Fabrication : /, ''))}</div>` : '';
  const files = (o.fichiers || []).map(f => `<a target="_blank" href="/admin/fichier/${o.id}/${encodeURIComponent(f)}${Q}">${esc(f)}</a>`).join('')
    + (o.job_id && o.statut !== 'attente_paiement' ? `<a href="/admin/archive/${o.id}${Q}">📦 dossier complet (zip, pour Claude)</a>` : '');
  return `<div class="book">${cov}<div>
    <div class="title">${esc(titre)}</div>
    <div class="meta">${(o.formule || '').startsWith('essai') ? '🧪 ' : ''}${esc(FORMULE[o.formule] || o.formule)}${o.extra ? (o.pack_total ? ` · avec ${o.pack_total} livre${o.pack_total > 1 ? 's' : ''}, même colis` : '') : o.pack_total > 1 ? ` · livre ${o.numero}/${o.pack_total}` : ''}${!o.extra && o.pack_cal ? ' · + ' + (o.pack_extras || []).map(x => x === 'calendrier' ? 'calendrier' : 'cahier').join(' + ') : ''}${o.volume_number ? ' · tome ' + o.volume_number : ''}${o.montant ? ' · ' + eur(o.montant) : ''} · ${day(o.cree)}</div>
    <span class="pill ${e.pill[0]}">${e.pill[1]} ${e.pill[2]}</span>
    <div class="say">${e.say}</div>
    ${e.k === 'fabrication' ? `<div class="prog"><div class="bar big"><i style="width:${o.progression || 1}%"></i></div><b>${o.progression || 0} %</b></div>${o.etape ? `<div class="meta">${esc(o.etape)}</div>` : ''}` : ''}
    ${bud ? `<div class="money">IA : <b>${usd(bud)}</b> / ${PL} $ <span class="bar"><i class="${pct > 80 ? 'warn' : ''}" style="width:${pct}%"></i></span></div>` : ''}
    ${err}${issues}
    <div class="acts">${bt.main}</div>
    ${RES[o.id] ? `<div class="result ${RES[o.id].cls || ''}"><button class="x" title="Fermer" onclick="delete RES['${o.id}'];render()">×</button>${RES[o.id].html}</div>` : ''}
    <details ${OPEN.has(o.id) ? 'open' : ''} ontoggle="this.open ? OPEN.add('${o.id}') : OPEN.delete('${o.id}')"><summary>Plus d'options et infos</summary><div class="more">
      <div>👤 ${esc(o.email)} · ${esc(a.nom)}, ${esc(a.adresse1)} ${esc(a.adresse2)}, ${esc(a.code_postal)} ${esc(a.ville)} · ${esc(a.telephone)}</div>
      ${o.pack_mail ? `<div>📧 Mail « livre prêt » envoyé au client le ${new Date(o.pack_mail * 1000).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}</div>` : ''}
      ${o.lulu_id ? `<div>🖨️ Lulu : travail ${esc(o.lulu_id)} · ${esc(o.lulu_statut)} · ${esc(o.lulu_cout)}</div>` : ''}
      <div class="files">${files}</div>
      <div class="acts">${bt.sec}</div><div class="muted" style="margin-top:6px">Réf. ${o.id}</div>
    </div></details>
  </div></div>`;
}

function liste(rows) { return rows.length ? rows.map(carte).join('') : ''; }

function vueAccueil() {
  const C = D.commandes.map(o => [o, etat(o).k]);
  const n = k => C.filter(([, x]) => x === k).length;
  const af = C.filter(([, k]) => AFAIRE.includes(k)).map(([o]) => o), fab = C.filter(([, k]) => k === 'fabrication').map(([o]) => o);
  const c = D.config;
  return `<div class="tiles">
      <div class="tile" onclick="go('livres','relire')"><span class="e">👀</span><div class="n">${n('relire')}</div><div class="l">à relire</div></div>
      <div class="tile" onclick="go('livres','fabrication')"><span class="e">🎨</span><div class="n">${n('fabrication')}</div><div class="l">en fabrication</div></div>
      <div class="tile" onclick="go('livres','pret')"><span class="e">✅</span><div class="n">${n('pret')}</div><div class="l">prêts à imprimer</div></div>
      <div class="tile" onclick="go('livres','bloque')"><span class="e">⚠️</span><div class="n">${n('bloque')}</div><div class="l">bloqués</div></div>
      <div class="tile" onclick="go('reglages')"><span class="e">💰</span><div class="n" style="font-size:22px">${usd(c.depense_jour)}</div><div class="l">IA aujourd'hui (max ${c.budget_jour} $)</div></div>
    </div>
    <h2>À faire</h2>${af.length ? liste(af) : `<div class="empty"><div class="big">🎉</div>Rien à faire pour l'instant. Les livres se fabriquent tout seuls.</div>`}
    ${fab.length ? `<h2>En train de se fabriquer</h2>${liste(fab)}` : ''}`;
}

const FILTRES = { actifs: '📚 En cours', relire: '👀 À relire', fabrication: '🎨 Fabrication', pret: '✅ Prêts', bloque: '⚠️ Bloqués', expedie: '📦 Expédiés', essai: '🧪 Essais', archive: '🗂️ Archivés', tout: 'Tout' };
function vueLivres() {
  const rows = D.commandes.filter(o => {
    const k = etat(o).k;

async function act(id, action, btn) {
  if (action === 'supprimer') {
    if (!confirm("Supprimer DÉFINITIVEMENT cette commande et tous ses fichiers ?\n\nRien n'est remboursé sur Stripe et rien n'est annulé chez Lulu : fais-le à part si besoin.")) return;
    if (prompt('Pour confirmer, tape SUPPRIMER') !== 'SUPPRIMER') return;
  } else if (CONFIRM[action] && !confirm(CONFIRM[action])) return;
  btn.disabled = true; const t = btn.innerHTML; btn.innerHTML = '⏳ ' + t;
  try {
    const r = await fetch(`/admin/api/${id}/${action}${Q}`, { method: 'POST', headers: H });
    const j = await r.json();
    if (j.erreur) RES[id] = { cls: 'err', html: '⚠️ ' + esc(j.erreur) };
    else if (action === 'supprimer') { delete RES[id]; await load(); return; }
    else if (action === 'budget') { budgetDlg(j.info); btn.disabled = false; btn.innerHTML = t; return; }
    else { const x = resultat(action, j); x.html = x.html.replace(/__ID__/g, id); RES[id] = x; }
  } catch (e) { RES[id] = { cls: 'err', html: '⚠️ ' + esc(e.message) }; }
  btn.disabled = false; btn.innerHTML = t;
  render(); setTimeout(load, 1500);
}

  const nom = quoi === 'coloriage' ? 'les cahiers de coloriage' : 'les calendriers';
  if (r.erreur) { RES._reg = { cls: 'err', html: '⚠️ ' + esc(r.erreur) }; return render(); }
  const ok = r.resultats.filter(x => x.ok), f = v => v == null ? '—' : parseFloat(v).toFixed(2).replace('.', ',') + ' €';
  RES._reg = ok.length
    ? { cls: 'ok', html: `${quoi === 'coloriage' ? '🖍️' : '📅'} <b>Lulu accepte ${nom} par l'API</b><table>${ok.map(x => `<tr><td>${esc(x.pod)} · ${x.pages} pages</td><td class="r">impression ${f(x.impression_ttc)}</td><td class="r">port ${f(x.port_ttc)}</td><td class="r"><b>${f(x.total_ttc)}</b></td></tr>`).join('')}</table>` }
    : { cls: 'err', html: `Aucun code accepté pour ${nom}. Première réponse de Lulu : <small>${esc((r.resultats[0] || {}).erreur || '')}</small>` };
  render();
}
function disqueHtml(d) {
  const k = d._disque, rows = Object.entries(d).filter(([n]) => n[0] !== '_').map(([n, v]) => `<tr><td>${esc(n)}</td><td class="r">${v.toLocaleString('fr-FR')} Mo</td></tr>`).join('');
  return (k ? `<b style="color:${k.libre_mo < 500 ? 'var(--red)' : 'var(--green)'}">${(k.libre_mo / 1000).toFixed(1)} Go libres</b> sur ${(k.total_mo / 1000).toFixed(1)} Go` : '') + `<table>${rows}</table>`;
}
async function chargerDisque() { try { const d = await (await fetch('/admin/api/disque' + Q, { headers: H })).json(); const e = document.getElementById('disque'); if (e) e.innerHTML = disqueHtml(d); } catch (_) {} }
async function nettoyer(b) {
  b.disabled = true; b.textContent = '⏳ Nettoyage…';
  const r = await (await fetch('/admin/api/disque/nettoyer' + Q, { method: 'POST', headers: H })).json(); b.disabled = false; b.textContent = '🧹 Libérer de la place';
  toast(r.ok ? `🧹 ${r.libere_mo} Mo libérés` : '⚠️ ' + (r.erreur || 'erreur')); document.getElementById('disque').innerHTML = disqueHtml(r.place || {});
}
async function vignettes(b) {
  b.disabled = true; const r = await (await fetch('/admin/api/vignettes' + Q, { method: 'POST', headers: H })).json();
  RES._reg = r.lancees ? { cls: 'ok', html: r.lancees.length ? `🖼️ ${r.lancees.length} vignette(s) en cours (quelques minutes).` : '✅ Toutes les vignettes sont déjà faites.' } : { cls: 'err', html: '⚠️ ' + esc(r.erreur || 'erreur') }; render();
}

async function load() {
  const r = await fetch('/admin/api/commandes' + Q, { headers: H });
  if (!r.ok) { document.getElementById('hi').textContent = 'Accès refusé : ajoute ?code=… à l\'adresse.'; return; }
  D = await r.json();
  const h = new Date().getHours();
  const nb = D.commandes.filter(o => AFAIRE.includes(etat(o).k)).length;
  document.getElementById('hi').textContent = `${h < 18 ? 'Bonjour' : 'Bonsoir'} Alex · ${nb ? nb + ' chose(s) à faire' : 'tout roule'}`;
  if (!document.getElementById('dlg').open) render();
}
load(); setInterval(() => { if (!document.hidden) load(); }, (D && D.commandes || []).some(o => o.en_cours) ? 4000 : 15000);
setInterval(() => { if (!document.hidden && D && (D.commandes || []).some(o => o.en_cours)) load(); }, 4000);
</script>
