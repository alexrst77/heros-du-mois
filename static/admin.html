<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/static/marque/favicon-64.png">
<link rel="apple-touch-icon" href="/static/marque/apple-touch-icon.png">
<title>Atelier – Mon Héros du Mois</title>
<style>
  @font-face { font-family:"Young Serif"; src:url("/static/fonts/YoungSerif-Regular.woff") format("woff"); font-display:swap; }
  @font-face { font-family:"Nunito"; src:url("/static/fonts/Nunito.woff") format("woff"); font-weight:200 1000; font-display:swap; }
  :root {
    --bg:#F6F1E7; --card:#FFFFFF; --ink:#1F2557; --soft:#6B6F8E; --line:#ECE3D2; --nuit:#1A1F4A; --gold:#FFC94A; --gold-soft:#FFF3D1;
    --blue:#3D6BD8; --blue-soft:#E6EDFC; --green:#2E8A5E; --green-soft:#DFF2E7; --red:#C9443F; --red-soft:#FBE4E2;
    --grey-soft:#F1ECE2; --violet:#7A5AD8; --violet-soft:#EEE8FC; --shadow:0 1px 2px rgba(31,37,87,.06), 0 8px 24px -12px rgba(31,37,87,.18);
    --titre:"Young Serif", Georgia, serif; --texte:"Nunito", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:500 15px/1.5 var(--texte); -webkit-font-smoothing:antialiased; }
  a { color:var(--blue); }
  :focus-visible { outline:3px solid var(--gold); outline-offset:2px; border-radius:6px; }
  /* ---- structure : barre latérale (ordinateur), barre du haut (téléphone) */
  .app { display:grid; grid-template-columns:232px 1fr; min-height:100vh; }
  aside { background:var(--nuit); color:#E3E6FA; padding:20px 14px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:4px; }
  .brand { display:flex; align-items:center; gap:10px; padding:4px 8px 18px; color:#fff; text-decoration:none; }
  .brand img { width:38px; height:38px; } .brand b { font:400 19px/1.1 var(--titre); } .brand small { display:block; font:600 12px var(--texte); color:#AEB4E0; }
  aside nav { display:flex; flex-direction:column; gap:2px; }
  aside nav button { display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; color:#C9CDF0; font:700 15px var(--texte); padding:10px 12px; border-radius:12px; cursor:pointer; text-align:left; }
  aside nav button:hover { background:rgba(255,255,255,.06); color:#fff; }
  aside nav button.on { background:rgba(255,201,74,.16); color:#fff; box-shadow:inset 3px 0 0 var(--gold); }
  aside nav .ic { width:22px; text-align:center; } aside nav .badge { margin-left:auto; min-width:22px; padding:1px 7px; border-radius:999px; background:var(--gold); color:var(--ink); font:800 12px var(--texte); text-align:center; }
  aside .bas { margin-top:auto; font-size:12px; color:#8F95C7; padding:8px; line-height:1.6; } aside .bas a { color:#C9CDF0; }
  .env { display:inline-block; padding:1px 8px; border-radius:999px; font-weight:800; font-size:11px; }
  .env.test { background:#FFF3D1; color:#8A5A00; } .env.live { background:#DFF2E7; color:#1E6B47; }
  main { padding:26px 30px 90px; max-width:1180px; width:100%; }
  .tete { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .tete h1 { font:400 30px/1.1 var(--titre); margin:0; } .tete .hi { color:var(--soft); margin-top:4px; }
  @media (max-width:900px) {
    .app { grid-template-columns:1fr; }
    aside { position:sticky; top:0; z-index:10; height:auto; flex-direction:row; align-items:center; padding:8px 10px; overflow-x:auto; gap:6px; }
    .brand { padding:0 6px 0 0; } .brand b, .brand small, aside .bas { display:none; }
    aside nav { flex-direction:row; } aside nav button { padding:8px 10px; white-space:nowrap; font-size:14px; } aside nav button span.t { display:none; } aside nav button.on span.t { display:inline; }
    main { padding:18px 14px 80px; }
  }
  /* ---- éléments */
  h2 { font:400 21px/1.2 var(--titre); margin:28px 0 12px; } h2:first-child { margin-top:0; }
  h3 { font:800 16px var(--texte); margin:0 0 8px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-bottom:8px; }
  .kpi { background:var(--card); border-radius:18px; padding:16px; box-shadow:var(--shadow); cursor:pointer; border:1px solid transparent; transition:border-color .15s; }
  .kpi:hover { border-color:var(--line); }
  .kpi .l { color:var(--soft); font-weight:700; font-size:13px; display:flex; justify-content:space-between; } .kpi .n { font:400 30px/1.1 var(--titre); margin-top:6px; } .kpi .s { color:var(--soft); font-size:13px; margin-top:2px; }
  .kpi.alerte { background:var(--gold-soft); } .kpi.sombre { background:var(--nuit); color:#fff; } .kpi.sombre .l, .kpi.sombre .s { color:#AEB4E0; }
  .empty { text-align:center; padding:36px 10px; color:var(--soft); background:var(--card); border-radius:18px; box-shadow:var(--shadow); }
  .empty .big { font-size:40px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chips button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:7px 13px; font:700 13px var(--texte); cursor:pointer; }
  .chips button.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .chips button em { font-style:normal; opacity:.6; margin-left:4px; }
  .book { display:grid; grid-template-columns:84px 1fr; gap:16px; background:var(--card); border-radius:18px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .cover { width:84px; height:84px; border-radius:12px; object-fit:cover; background:linear-gradient(135deg, #F7D99A, #9DB7F0); display:flex; align-items:center; justify-content:center; font-size:34px; overflow:hidden; }
  .cover img { width:100%; height:100%; object-fit:cover; }
  .ligne1 { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .title { font:400 18px/1.25 var(--titre); margin:0; } .prix { font:800 16px var(--texte); white-space:nowrap; }
  .meta, .muted { color:var(--soft); font-size:13px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-weight:800; font-size:12.5px; margin:8px 6px 0 0; }
  .p-gold { background:var(--gold-soft); color:#8A5A00; } .p-blue { background:var(--blue-soft); color:var(--blue); } .p-green { background:var(--green-soft); color:var(--green); }
  .p-red { background:var(--red-soft); color:var(--red); } .p-grey { background:var(--grey-soft); color:var(--soft); } .p-violet { background:var(--violet-soft); color:var(--violet); }
  .say { margin:6px 0 0; font-size:14px; }
  .bar { height:8px; background:var(--grey-soft); border-radius:99px; overflow:hidden; margin-top:8px; max-width:420px; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg, var(--blue), var(--violet)); border-radius:99px; transition:width .6s; }
  .money { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--soft); margin-top:8px; }
  .prog { display:flex; align-items:center; gap:10px; max-width:460px; margin-top:8px; } .prog .bar { flex:1; margin:0; }
  .bar.big { height:12px; } .prog b { font:800 15px var(--texte); min-width:46px; text-align:right; }
  .money .bar { width:120px; height:6px; margin:0; } .money .bar i { background:var(--green); } .money .bar i.warn { background:var(--gold); }
  .acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .btn { border:0; border-radius:12px; padding:9px 15px; font:800 14px var(--texte); cursor:pointer; background:var(--grey-soft); color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover { filter:brightness(.97); }
  .btn.main { background:var(--ink); color:#fff; } .btn.ok { background:var(--green); color:#fff; } .btn.gold { background:var(--gold); color:var(--ink); }
  .btn.danger { background:var(--red-soft); color:var(--red); } .btn:disabled { opacity:.5; cursor:wait; }
  details.plus { margin-top:10px; } details.plus > summary { cursor:pointer; color:var(--soft); font-size:13px; font-weight:700; list-style:none; }
  details.plus > summary::before { content:"▸ "; } details.plus[open] > summary::before { content:"▾ "; }
  .more { margin-top:8px; font-size:13px; color:var(--soft); } .more .acts { margin-top:8px; } .more .btn { padding:7px 12px; font-size:13px; }
  .files a { display:inline-block; margin:4px 10px 0 0; }
  .issues { margin:8px 0 0; padding:10px 12px; background:var(--gold-soft); border-radius:12px; font-size:13px; } .issues.red { background:var(--red-soft); }
  .issues ul { margin:4px 0 0 18px; padding:0; }
  .result { position:relative; margin-top:10px; padding:12px 40px 12px 14px; border-radius:12px; background:var(--blue-soft); font-size:14px; }
  .result.ok { background:var(--green-soft); } .result.err { background:var(--red-soft); color:#8B2420; }
  .result .x { position:absolute; top:6px; right:8px; border:0; background:transparent; font-size:18px; cursor:pointer; color:var(--soft); }
  .result table { margin-top:6px; } .result .big { font:400 20px var(--titre); }
  .card { background:var(--card); border-radius:18px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow); }
  .card > h3 { display:flex; align-items:center; gap:8px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:14px; } .grid2 .card { margin:0; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14px; } .kv span:nth-child(odd) { color:var(--soft); }
  dialog { border:0; border-radius:20px; padding:0; max-width:680px; width:calc(100% - 32px); box-shadow:0 20px 60px rgba(0,0,0,.25); color:var(--ink); }
  dialog .in { padding:20px; max-height:80vh; overflow:auto; } dialog h3 { font:400 19px var(--titre); margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums; } td, th { padding:7px 6px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--soft); font-weight:800; font-size:12px; } td.r, th.r { text-align:right; }
  tr.tot td { font-weight:800; border-bottom:0; }
  .champ { display:grid; gap:4px; font:700 13px var(--texte); color:var(--soft); } .champ input, .champ select { font:600 14px var(--texte); color:var(--ink); padding:9px 11px; border:1.5px solid var(--line); border-radius:10px; background:#fff; width:100%; }
  .champ.req span::after { content:" *"; color:var(--red); } .form { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
  .bandeau { display:flex; gap:12px; align-items:center; background:var(--gold-soft); border-radius:14px; padding:12px 14px; margin-bottom:14px; font-size:14px; }
  .bandeau.rouge { background:var(--red-soft); } .bandeau .btn { margin-left:auto; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(120px); background:var(--ink); color:#fff; padding:12px 18px; border-radius:14px; font-weight:700; max-width:calc(100% - 32px); transition:transform .3s, opacity .3s; z-index:20; opacity:0; pointer-events:none; }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  /* ---- rentabilité */
  .sim { display:grid; grid-template-columns:minmax(280px, 360px) 1fr; gap:16px; align-items:start; }
  @media (max-width:1000px) { .sim { grid-template-columns:1fr; } }
  .reg { display:grid; gap:12px; } .reg .r { display:grid; grid-template-columns:1fr 92px; gap:8px; align-items:center; font-size:13.5px; }
  .reg input[type=range] { grid-column:1 / -1; width:100%; accent-color:var(--ink); margin:0; }
  .reg input[type=number] { font:700 14px var(--texte); padding:6px 8px; border:1.5px solid var(--line); border-radius:9px; width:100%; text-align:right; }
  .reg fieldset { border:1px solid var(--line); border-radius:14px; padding:10px 12px 12px; margin:0; display:grid; gap:10px; } .reg legend { font:800 13px var(--texte); padding:0 6px; }
  .grand { font:400 44px/1 var(--titre); } .grand.pos { color:var(--green); } .grand.neg { color:var(--red); }
  .barres { display:grid; gap:8px; margin-top:12px; } .barres .b { display:grid; grid-template-columns:150px 1fr 92px; gap:10px; align-items:center; font-size:13px; }
  .barres .b i { display:block; height:14px; border-radius:6px; min-width:2px; } .barres .b span.v { text-align:right; font-weight:800; font-variant-numeric:tabular-nums; }
  .ok-c { color:var(--green); font-weight:800; } .ko-c { color:var(--red); font-weight:800; } .mid-c { color:#8A5A00; font-weight:800; }
  @media (max-width:560px) { .book { grid-template-columns:56px 1fr; } .cover { width:56px; height:56px; font-size:26px; } .barres .b { grid-template-columns:100px 1fr 80px; } }
  td.r, th.r { white-space:nowrap; }
  #simRes { position:sticky; top:16px; align-self:start; }
  .reg-d { border:1px solid var(--line); border-radius:14px; padding:10px 12px; } .reg-d summary { font:800 13px var(--texte); cursor:pointer; } .reg-d fieldset { border:0; padding:10px 0 0; margin:0; display:grid; gap:10px; }
  @media (max-width:900px) { #simRes { position:static; } }
  .kv span { overflow-wrap:anywhere; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <a class="brand" href="/" target="_blank"><img src="/static/marque/etoile-128.png" alt=""><span><b>L'atelier</b><small>Mon Héros du Mois</small></span></a>
    <nav id="nav"></nav>
    <div class="bas" id="bas"></div>
  </aside>
  <main>
    <div class="tete"><div><h1 id="titre">Tableau de bord</h1><div class="hi" id="hi">Chargement…</div></div><div id="teteActs"></div></div>
    <div id="view"></div>
  </main>
</div>
<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>
<div id="toast"></div>

<script>

const code = new URLSearchParams(location.search).get('code') || '';
const H = { 'X-Admin': code }, Q = '?code=' + encodeURIComponent(code);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = c => (c / 100).toFixed(2).replace('.', ',') + ' €';
const usd = v => (v || 0).toFixed(2).replace('.', ',') + ' $';
const day = t => t ? new Date(t * 1000).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : '';
const FORMULE = { livre: '1 livre', pack3: 'Pack 3 livres', pack6: 'Pack 6 livres', pack12: 'Pack 12 livres', fetes: '6 livres de fête', mensuel: 'Abonnement (ancien)', annuel: 'Abonnement annuel', essai_brouillon: 'Essai brouillon', essai_apercu: 'Essai aperçu', calendrier: '📅 Calendrier', coloriage: '🖍️ Cahier de coloriage', gourde: '🥤 Gourde', tasse: '☕ Tasse', sac: '🎒 Sac à dos' };
const NOMX = { calendrier: 'le calendrier', coloriage: 'le cahier', gourde: 'la gourde', tasse: 'la tasse', sac: 'le sac à dos' };
// colis = livres + calendrier de la même commande
const NB = o => (o.pack_total || 0) + (o.pack_cal || 0), PRETS = o => (o.pack_prets || 0) + (o.pack_cal_prets || 0);
const colis = o => [(o.pack_total ? `${o.pack_total} livre${o.pack_total > 1 ? 's' : ''}` : '')].concat((o.pack_extras || []).map(x => NOMX[x] || x)).filter(Boolean).join(' + ');
let D = null, TAB = 'tableau', FILTRE = 'actifs';
const RES = {}, OPEN = new Set();   // résultats affichés sous un livre (restent jusqu'à ce que tu les fermes) ; menus ouverts

function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 4200); }

// État d'un livre, en clair
function etat(o) {
  const essai = (o.formule || '').startsWith('essai');
  if (o.statut === 'attente_paiement') return { k: 'paiement', pill: ['p-grey', '💳', 'Attend le paiement'], say: "Le client n'a pas encore payé." };
  if (o.statut === 'attente_fete') return { k: 'attente', pill: ['p-violet', '🎉', 'Attend sa fête'], say: 'Il partira tout seul 35 jours avant la fête.' };
  if (o.en_cours || ['payee', 'generation'].includes(o.statut)) return { k: 'fabrication', pill: ['p-blue', '🎨', 'En fabrication'], say: o.etape ? esc(o.etape) + '…' : 'Le livre se fabrique (5 à 10 minutes).' };
  if (o.statut === 'erreur' && !o.pdf) return { k: 'bloque', pill: ['p-red', '⚠️', 'Bloqué'], say: 'La fabrication s\'est arrêtée. Rien n\'est perdu : ce qui est fait est gardé.' };
  if (o.statut === 'a_verifier' || (o.statut === 'erreur' && o.pdf)) {
    if (essai) return { k: 'essai', pill: ['p-violet', '🧪', 'Essai terminé'], say: 'Livre d\'essai : à regarder, jamais imprimé.' };
    if (o.finalise && NB(o) > 1 && (PRETS(o) < NB(o) || (o.origine && o.origine !== o.id)))
      return { k: 'valide', pill: ['p-green', '✅', 'Validé'], say: PRETS(o) < NB(o)
        ? `Figé et sauvegardé. Le colis partira quand tout sera validé : ${colis(o)} (${PRETS(o)}/${NB(o)}).`
        : 'Figé et sauvegardé. Il part avec le livre 1 du pack, dans le même colis.' };
    if (o.finalise) return { k: 'pret', pill: ['p-green', '✅', 'Prêt à imprimer'], say: NB(o) > 1 ? `Tout est validé (${colis(o)}) : ça part ensemble, dans un seul colis.` : 'Figé et sauvegardé. Il ne coûtera plus jamais rien en IA.' };
    return { k: 'relire', pill: ['p-gold', '👀', 'À relire'], say: 'Ouvre le livre, regarde les pages, puis valide-le.' };
  }
  if (o.statut === 'envoyee_impression' && o.printful_statut === 'draft') return { k: 'imprimeur', pill: ['p-gold', '📝', 'Brouillon Printful'], say: "Brouillon chez Printful : rien n'est fabriqué ni facturé tant que tu ne confirmes pas." };
  if (o.statut === 'envoyee_impression') return { k: 'imprimeur', pill: ['p-blue', '🖨️', "Chez l'imprimeur"], say: o.printful_id ? 'Printful : ' + esc(PRINTFUL_FR[o.printful_statut] || o.printful_statut || '') : o.lulu_statut ? 'Lulu : ' + esc(LULU_FR[o.lulu_statut] || o.lulu_statut) : '' };
  if (o.statut === 'expediee') return { k: 'expedie', pill: ['p-green', '📦', 'Expédié'], say: (o.suivi || []).length ? 'Colis en route.' : '' };
  if (o.statut === 'annulee') return { k: 'archive', pill: ['p-grey', '🗂️', 'Archivé'], say: o.erreur === 'données effacées' ? 'Données effacées.' : '' };
  return { k: 'autre', pill: ['p-grey', '•', o.statut], say: '' };
}
const AFAIRE = ['relire', 'bloque', 'pret'];
const LULU_FR = { CREATED: 'commande reçue', UNPAID: 'en attente de paiement chez Lulu', PAYMENT_IN_PROGRESS: 'paiement en cours chez Lulu', PRODUCTION_DELAYED: 'impression retardée (Lulu vérifie les fichiers)',
  PRODUCTION_READY: "prêt pour l'impression", IN_PRODUCTION: "en cours d'impression", SHIPPED: 'expédié', REJECTED: 'refusé par Lulu (fichiers à revoir)', CANCELED: 'annulé', ERROR: 'erreur chez Lulu' };
const PRINTFUL_FR = { draft: 'brouillon à confirmer', pending: 'en attente', inprocess: 'en fabrication', onhold: 'en pause (Printful a une question)', partial: 'expédié en partie',
  fulfilled: 'expédié', failed: 'échec', canceled: 'annulé' };

function boutons(o, e) {
  const pdf = (o.fichiers || []).find(f => f.endsWith('.pdf') && !f.startsWith('impression_'));
  const lire = pdf ? `<a class="btn" target="_blank" href="/admin/fichier/${o.id}/${encodeURIComponent(pdf)}${Q}">${o.calendrier ? '📅 Voir le calendrier' : o.coloriage ? '🖍️ Voir le cahier' : o.objet ? '👀 Voir ' + NOMX[o.objet] : '📖 Lire le livre'}</a>` : '';
  const b = (a, t, cls = '') => `<button class="btn ${cls}" onclick="act('${o.id}','${a}',this)">${t}</button>`;
  let main = '';
  if (e.k === 'paiement' && D.config.stripe === 'simulé') main = b('valider-paiement-test', '💳 Simuler le paiement', 'main');
  if (e.k === 'relire') main = lire + b('finaliser', "✅ C'est bon, je valide", 'ok') + (o.refusees ? b('refaire-refusees', '🔁 Refaire les images refusées') : '');
  if (e.k === 'pret') main = lire + b('imprimer', NB(o) > 1 ? `🖨️ Envoyer le colis (${colis(o)})` : "🖨️ Envoyer à l'impression", 'gold');
  if (e.k === 'valide') main = lire;
  if (e.k === 'essai') main = lire;
  if (e.k === 'bloque' && o.budget && (o.budget.incertain > 0 || o.budget.reserve > 0) && !o.en_cours) main = b('budget', '💰 Régler l\'appel incertain', 'main');
  else if (e.k === 'bloque') main = (o.refusees ? b('refaire-refusees', '🔁 Refaire les images refusées', 'main') : '') + b('relancer', '▶️ Relancer', o.refusees ? '' : 'main');
  if (e.k === 'imprimeur') main = (o.printful_statut === 'draft' ? b('printful-confirmer', '✅ Confirmer chez Printful (payant)', 'gold') : '') + b('suivi', '🔄 Actualiser le suivi', o.printful_statut === 'draft' ? '' : 'main');

             b('test-gourde', '🧪 Gourde de test (≈ 0,30 $)'), b('test-tasse', '🧪 Tasse de test (≈ 0,30 $)'), b('test-sac', '🧪 Sac de test (≈ 0,30 $)'));

    o.volume_number ? 'tome ' + o.volume_number : '', day(o.cree), esc(a.nom || o.email || '')].filter(Boolean).join(' · ');
  return `<div class="book">${cov}<div>

/* ================================================================ tableau de bord */
const debutMois = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1).getTime() / 1000; };
function ventes(depuis) {        // commandes payées (celles qui portent le montant)
  return D.commandes.filter(o => o.montant && !o.paiement_test && (o.origine || o.id) === o.id && o.statut !== 'attente_paiement' && !(o.formule || '').startsWith('essai') && o.cree >= depuis);
}
function vueTableau() {
  const C = D.commandes.map(o => [o, etat(o).k]);
  const n = k => C.filter(([, x]) => x === k).length;
  const af = C.filter(([, k]) => AFAIRE.includes(k)).map(([o]) => o), fab = C.filter(([, k]) => k === 'fabrication').map(([o]) => o);
  const c = D.config, mois = ventes(debutMois()), ca = mois.reduce((t, o) => t + o.montant, 0);

    </div>
    <h2>À faire</h2>${af.length ? liste(af) : `<div class="empty"><div class="big">🎉</div>Rien à faire pour l'instant. Les créations se fabriquent toutes seules.</div>`}

  gourde: 43.5, tasse: 19, sac: 54.5, stripePct: 1.5, stripeFixe: .25, cotis: 12.3, cac: 25, n: 50, partPub: 70, fixes: 15,

function paniers() {
  const T = RENTA.tarifs, F = T.formules, h = HYP, reel = RENTA.regime === 'reel', tx = RENTA.taux_tva;

    const marge = ht - fabN - portN - ia - st, cout = fabN + portN + ia + st;
    return { nom, ttc, ht, cout, marge, txMarge: marge / cout, txMarque: marge / ht, cacMax: marge - ht * h.cotis / 100, conf };

  return [

    L('Calendrier seul', T.calendrier.seul / 100 + T.calendrier.port / 100, h.calFab, h.calPortSeul, 1.73 * h.usd, 'calendrier', false, 'non mesuré'),
    L('Coloriage seul', T.coloriage.seul / 100 + T.coloriage.port / 100, h.coloFab, h.coloPortSeul, 1.89 * h.usd, 'coloriage', false, 'non mesuré'),
    L('Calendrier en ajout', T.calendrier.ajout / 100, h.calFab, h.calPortAjout, 1.6 * h.usd, 'calendrier', true, 'réel (1 commande)'),
    L('Coloriage en ajout', T.coloriage.ajout / 100, h.coloFab, h.coloPortAjout, 1.9 * h.usd, 'coloriage', true, 'réel (1 commande)'),
    L('Tasse (ajout)', T.objets.tasse.prix / 100, h.tasse, 0, .1 * h.usd, 'objet', true, 'devis Printful'),
    L('Gourde (ajout)', T.objets.gourde.prix / 100, h.gourde, 0, .1 * h.usd, 'objet', true, 'devis Printful'),
    L('Sac (ajout)', T.objets.sac.prix / 100, h.sac, 0, .25 * h.usd, 'objet', true, 'devis Printful')];

function scenario() {
  const P = Object.fromEntries(paniers().map(p => [p.nom, p])), h = HYP;
  const mix = [['Livre seul', h.mLivre], ['Pack 3', h.mP3], ['Pack 6', h.mP6], ['Pack 12', h.mP12], ['Calendrier seul', h.mCal], ['Coloriage seul', h.mColo]];
  const somme = mix.reduce((t, [, v]) => t + v, 0) || 1;
  const livres = (h.mLivre + h.mP3 + h.mP6 + h.mP12) / somme;
  const aj = [['Calendrier en ajout', h.aCal], ['Coloriage en ajout', h.aColo], ['Tasse (ajout)', h.aTasse], ['Gourde (ajout)', h.aGourde], ['Sac (ajout)', h.aSac]];
  let ca = 0, ht = 0, cout = 0, marge = 0;
  mix.forEach(([k, v]) => { const q = h.n * v / somme, p = P[k]; ca += p.ttc * q; ht += p.ht * q; cout += p.cout * q; marge += p.marge * q; });
  aj.forEach(([k, v]) => { const q = h.n * livres * v / 100, p = P[k]; ca += p.ttc * q; ht += p.ht * q; cout += p.cout * q; marge += p.marge * q; });
  const pub = h.n * h.partPub / 100 * h.cac, cotis = ht * h.cotis / 100;
  return { ca, ht, cout, marge, pub, cotis, fixes: h.fixes, res: marge - pub - cotis - h.fixes, panier: ca / Math.max(h.n, 1), annuel: ca * 12 };
}

async function act(id, action, btn) {

    const r = await fetch(`/admin/api/${id}/${action}${Q}`, { method: 'POST', headers: H });

    try { j = JSON.parse(txt); } catch (_) { j = { erreur: `Erreur du serveur (${r.status}) : réessaie dans une minute, ou envoie-moi une capture.` }; }

      <div class="meta" style="margin-top:8px">Dépense du jour : <b>${usd(c.depense_jour)}</b> sur ${c.budget_jour} $ (variable BUDGET_OPENAI_JOUR dans Railway)</div>
      <div class="meta">Prix confirmés le <b>${esc(e.confirme_le || '—')}</b> · image de référence : <b>${esc(e.jetons_image_entree_max || 'non calibrée')}</b> jetons</div>
      <div class="meta">gpt-image-2 : texte ${m['gpt-image-2'].texte_entree} $/M · image entrée ${m['gpt-image-2'].image_entree} $/M · image sortie ${m['gpt-image-2'].sortie_image} $/M — gpt-4.1 : ${m['gpt-4.1'].texte_entree} / ${m['gpt-4.1'].sortie} $/M</div>
      <div class="acts"><button class="btn" onclick="confirmer()">J'ai vérifié les prix OpenAI</button><button class="btn" onclick="calibrer(this)" ${e.confirme_le ? '' : 'disabled'}>Recalibrer (≈ 0,02 $)</button></div>`}
  </div>
  <div class="card"><h3>🔌 Branchements</h3><div class="kv">
    <span>Paiement</span><span>${c.stripe === 'live' ? '🟢 réel' : c.stripe === 'test' ? '🟡 test (carte 4242)' : '⚪️ simulé'}</span>
    <span>Imprimeur livres</span><span>${c.lulu === 'non configuré' ? '⚪️ Lulu non branché' : c.lulu === 'production' ? '🟢 Lulu (réel)' : '🟡 Lulu bac à sable'}</span>
    <span>Objets</span><span>${c.printful ? (c.printful_confirmer ? '🟢 Printful (envoi réel)' : '🟡 Printful (brouillons à confirmer)') : '⚪️ Printful non branché'}</span>
    <span>Produit</span><span>${esc(c.pod)}</span>
    <span>Adresse du site</span><span>${esc(c.public_url || '—')}</span>
    <span>Impression auto</span><span>${c.auto_impression ? 'oui' : 'non (tu valides chaque livre)'}</span></div></div>
  <div class="card"><h3>🏷️ Comparer les prix d'impression</h3>
    <p class="meta" style="margin:0">Devis Lulu pour plusieurs fabrications (rigide, souple, agrafé…) et deux livraisons. Aucune commande, rien n'est payé.</p>
    <div class="acts"><button class="btn" onclick="comparer(this)">Comparer</button></div></div>
  <div class="card"><h3>🎒 Printful (gourdes, sacs, tasses)</h3>
    <p class="meta" style="margin:0">Vérifie la connexion et cherche dans le catalogue (mots en anglais, séparés par des virgules). Lecture seule : aucune commande.</p>
    <input id="pfq" placeholder="bottle, backpack, kid, mug, puzzle" style="width:100%;margin-top:8px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);font:600 14px var(--texte)">
    <div class="acts"><button class="btn" onclick="printfulCat(this)">Vérifier et chercher</button></div></div>
  <div class="card"><h3>📅 Calendriers Lulu (test)</h3>
    <p class="meta" style="margin:0">Code produit : <b>${esc(c.pod_calendrier || '')}</b> · fichiers ${c.calendrier_valide ? '<b class="ok-c">validés par Lulu ✅</b>' : '<b class="ko-c">pas encore validés</b> (bouton « 🔎 Vérifier les fichiers chez Lulu » sur un calendrier)'}.<br>Devis de test : aucune commande.</p>
    <div class="acts"><button class="btn" onclick="calendrier(this)">Tester</button></div></div>
  <div class="card"><h3>🖍️ Cahiers de coloriage Lulu (test)</h3>
    <p class="meta" style="margin:0">Code produit : <b>${esc(c.pod_coloriage || '')}</b> · fichiers ${c.coloriage_valide ? '<b class="ok-c">validés par Lulu ✅</b>' : '<b class="ko-c">pas encore validés</b> (bouton « 🔎 Vérifier les fichiers chez Lulu » sur un cahier)'}.<br>Devis de test (Lettre US, spirale, noir et blanc) : aucune commande.</p>
    <div class="acts"><button class="btn" onclick="calendrier(this, 'coloriage')">Tester</button></div></div>
  </div>
  <h2>Entretien</h2><div class="grid2">
  <div class="card"><h3>🔒 Données personnelles (RGPD)</h3>
    <p class="meta" style="margin:0">La politique de confidentialité promet d'effacer prénoms, photos et fichiers au plus tard 3 mois après la livraison. Ce bouton efface ceux des commandes expédiées depuis plus de 30 jours. Les factures et le livre des recettes restent.</p>
    <div class="acts"><button class="btn" onclick="purgeRgpd(this)">🧹 Effacer les anciennes données</button></div></div>
  <div class="card"><h3>💾 Place sur le disque</h3>
    <div id="disque" class="meta">Chargement…</div>
    <div class="acts"><button class="btn" onclick="nettoyer(this)">🧹 Libérer de la place</button></div>
    <p class="meta" style="margin:0">Efface seulement les fichiers temporaires, les essais de plus de 3 jours et les créations jamais commandées. Rien de ce qui sert n'est touché.</p></div>
  <div class="card"><h3>🖼️ Vignettes de l'accueil du site</h3>
    <p class="meta" style="margin:0">Illustrations des cartes univers et fêtes encore manquantes (une image par vignette).</p>
    <div class="acts"><button class="btn" onclick="vignettes(this)">Générer les vignettes manquantes</button></div></div>
  </div>`;
}

/* ================================================================ navigation */
const TABS = [['tableau', '🏠', 'Tableau de bord'], ['commandes', '📚', 'Commandes'], ['rentabilite', '💶', 'Rentabilité'], ['factures', '🧾', 'Factures'], ['clients', '👥', 'Clients'], ['messages', '💬', 'Messages'], ['reglages', '⚙️', 'Réglages']];
const VUES = { tableau: vueTableau, commandes: vueCommandes, rentabilite: vueRentabilite, factures: vueFactures, clients: vueClients, messages: vueMessages, reglages: vueReglages };
function render() {
  const nb = D.commandes.filter(o => AFAIRE.includes(etat(o).k)).length;
  const badge = { tableau: nb, factures: D.a_facturer || 0, messages: D.messages_non_lus || 0 };
  document.getElementById('nav').innerHTML = TABS.map(([k, ic, t]) => `<button class="${k === TAB ? 'on' : ''}" onclick="go('${k}')"><span class="ic">${ic}</span><span class="t">${t}</span>${badge[k] ? `<span class="badge">${badge[k]}</span>` : ''}</button>`).join('');
  const c = D.config;
  document.getElementById('bas').innerHTML = `${c.stripe === 'live' ? '🟢 Stripe réel' : c.stripe === 'test' ? '🟡 Stripe test' : '⚪️ Stripe simulé'}<br>${c.lulu === 'production' ? '🟢 Lulu réel' : c.lulu === 'non configuré' ? '⚪️ Lulu non branché' : '🟡 Lulu bac à sable'}<br><a href="/" target="_blank">Voir le site ↗</a>`;
  document.getElementById('titre').textContent = (TABS.find(x => x[0] === TAB) || TABS[0])[2];
  document.getElementById('teteActs').innerHTML = TAB === 'clients' ? `<button class="btn" onclick="CLI=null;render()">↻ Actualiser</button>` : TAB === 'commandes' || TAB === 'tableau' ? `<button class="btn" onclick="load()">↻ Actualiser</button>` : TAB === 'rentabilite' ? `<button class="btn" onclick="RENTA=null;render()">↻ Recharger les ventes</button>` : '';
  const y = scrollY, f = document.activeElement && document.activeElement.id;
  if (TAB === 'reglages' && f && /^(v_|t_|pfq)/.test(f)) return;   // saisie en cours : on ne touche à rien
  if (TAB === 'rentabilite' && RENTA && document.getElementById('simRes') && f && f.startsWith('h_')) return;   // ne pas casser la saisie
  if (TAB === 'clients' && f === 'cliq' && document.activeElement.value !== CLI_Q) return;
  document.getElementById('view').innerHTML = VUES[TAB]();
  if (TAB === 'reglages') chargerDisque();
  scrollTo(0, y);
}
function go(t, f) { TAB = VUES[t] ? t : 'tableau'; if (f) FILTRE = f; try { history.replaceState(null, '', location.pathname + Q + '#' + TAB); } catch (_) {} render(); scrollTo(0, 0); }

async function load() {
  const r = await fetch('/admin/api/commandes' + Q, { headers: H });
  if (!r.ok) { document.getElementById('hi').textContent = 'Accès refusé : ajoute ?code=… à l\'adresse.'; return; }
  D = await r.json();
  const h = new Date().getHours();
  const nb = D.commandes.filter(o => AFAIRE.includes(etat(o).k)).length;
  document.getElementById('hi').textContent = `${h < 5 || h >= 18 ? 'Bonsoir' : 'Bonjour'} Alex · ${nb ? nb + ' chose' + (nb > 1 ? 's' : '') + ' à faire' : 'tout roule'} · ${new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}`;
  if (!document.getElementById('dlg').open) render();
}
TAB = VUES[location.hash.slice(1)] ? location.hash.slice(1) : 'tableau';
load();
setInterval(() => { if (!document.hidden && D && !['rentabilite', 'reglages'].includes(TAB)) load(); }, 15000);
setInterval(() => { if (!document.hidden && D && (D.commandes || []).some(o => o.en_cours)) load(); }, 4000);

</script>
</body>
</html>
